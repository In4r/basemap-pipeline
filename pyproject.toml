[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basemap-pipeline"
version = "0.1.0"
description = "Pipeline for generating basemap tiles/layers from a bounding box"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "jsonschema>=4.18",
    "numpy>=1.26",
    "pyproj>=3.6",
    # Add more as the pipeline is implemented, e.g.:
    # "rasterio>=1.3",
    # "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
]
storage = [
    "dvc[s3]>=3.50",
]

[project.scripts]
generate-basemap = "basemap_pipeline.cli:main"
validate-geometry = "basemap_pipeline.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
basemap_pipeline = ["schema/*.json"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "pyproj", "pyproj.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
