[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basemap-pipeline"
version = "0.1.0"
description = "Pipeline for generating basemap tiles/layers from a bounding box"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Add real deps as the pipeline is implemented, e.g.:
    # "rasterio>=1.3",
    # "shapely>=2.0",
    # "geopandas>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
]
storage = [
    "dvc[s3]>=3.50",
]

[project.scripts]
generate-basemap = "basemap_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
