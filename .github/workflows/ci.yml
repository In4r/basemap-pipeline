name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest)
        run: pytest -v

      - name: Emit a document and validate it against the v0 schema
        run: |
          generate-basemap --mock --out-dir "$RUNNER_TEMP/geom" -73.070 40.945 -73.060 40.953
          validate-geometry "$RUNNER_TEMP"/geom/*.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t basemap-pipeline:ci .
